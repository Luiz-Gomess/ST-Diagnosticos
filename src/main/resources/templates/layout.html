<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    
    <title th:text="${ titulo }">Laudo Médico</title>
</head>
<body>
    <div class="container my-5">
        <div class="card shadow-sm">
            <div class="card-header bg-light p-4" th:replace="~{fragments/header}">
                </div>

            <div class="card-body p-4">
                <div layout:fragment="conteudo">
                    <p>O conteúdo do laudo específico aparecerá aqui.</p>
                </div>
            </div>

            <div class="card-footer text-muted small p-4" th:replace="~{fragments/footer}">
                </div>
        </div>
    </div>
</body>
</html>
